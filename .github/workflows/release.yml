name: Release
on:
  # start a release from the GitHub Actions UI (or `gh workflow run release.yml`)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from.'
        required: true
        type: string
        default: 'develop'
      bump:
        description: 'Version increment relative to the latest release tag. Ignored if a version number is given below.'
        required: true
        type: choice
        default: 'minor'
        options:
          - minor
          - patch
          - major
          - dev
      version:
        description: 'Version number to release, e.g. 0.3.0. Overrides the increment selected above.'
        required: false
        type: string
      run_tests:
        description: 'Run the test suite before drafting the release.'
        required: false
        type: boolean
        default: true
  push:
    branches:
      # a release can also be started by pushing a release branch
      - v[0-9]+.[0-9]+.[0-9]+*
      # merging the release branch drafts the release and publishes to PyPI
      - main
  # publishing a release draft manually also publishes to PyPI
  release:
    types:
      - published
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:

  prep:
    name: Prepare release
    # runs on workflow_dispatch, or when a release branch is pushed
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name != 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:

      - name: Check release branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ inputs.branch }}" == "main" ]]; then
            echo "error: releases may not be started from main"
            exit 1
          fi

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install
        run: uv sync --all-extras

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              ver="${{ inputs.version }}"
            else
              ver=$(uv run scripts/update_version.py --get --bump "${{ inputs.bump }}")
            fi
          else
            # release branch name is the version number, prefixed with 'v'
            ref="${{ github.ref_name }}"
            ver="${ref#"v"}"
          fi
          echo "releasing version $ver"
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Create release branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: git switch -c "v${{ steps.version.outputs.version }}"

      - name: Update version
        run: |
          uv run scripts/update_version.py -v "${{ steps.version.outputs.version }}"
          uv run python -c "import modflowapi; print('Version: ', modflowapi.__version__)"

      - name: Lint and format
        run: |
          uvx ruff check --fix .
          uvx ruff format .
          uvx codespell

      - name: Install modflow executables
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        uses: modflowpy/install-modflow-action@v1
        with:
          path: ${{ github.workspace }}/autotest
          repo: modflow6-nightly-build

      # temporary. devtools 2.x will autosync, but 1.x needs opt-in.
      - name: Sync devtools
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: uv run mf sync

      - name: Run tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        working-directory: ./autotest
        run: uv run pytest -v -n auto -m "not mf6"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased --tag ${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Update changelog
        run: |
          # substitute full group names
          sed -i 's/#### Ci/#### Continuous integration/' CHANGELOG.md
          sed -i 's/#### Feat/#### New features/' CHANGELOG.md
          sed -i 's/#### Fix/#### Bug fixes/' CHANGELOG.md
          sed -i 's/#### Perf/#### Performance/' CHANGELOG.md
          sed -i 's/#### Refactor/#### Refactoring/' CHANGELOG.md
          sed -i 's/#### Test/#### Testing/' CHANGELOG.md

          # prepend this release's changelog to the cumulative changelog
          clog="HISTORY.md"
          temp="temp.md"
          echo "$(tail -n +2 $clog)" > $clog
          cat CHANGELOG.md $clog > $temp
          mv $temp $clog
          sed -i '1i # Changelog' $clog

      - name: Push release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.version.outputs.version }}"

          # the release notes have already been prepended to HISTORY.md,
          # keep a copy for the PR body then drop the standalone changelog
          notes=$(grep -v "### Version $ver" CHANGELOG.md)
          rm -f CHANGELOG.md

          git config core.sharedRepository true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(release): set version to $ver, update changelog"
          git push origin "v$ver"

          body='
          # Release '$ver'

          The release can be approved by merging this pull request into `main`. This will tag and
          draft a GitHub release, publish the package to PyPI, and open a follow-up pull request
          resetting `develop` from `main` with the version incremented.

          ## Changelog

          '$notes'
          '
          gh pr create -B "main" -H "v$ver" --title "Release $ver" --draft --body "$body"

  release:
    name: Draft release
    # runs only when the release branch is merged to main
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version.txt)
          echo "version=$version" >> $GITHUB_OUTPUT

          # skip if this version has already been released
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "tag $version already exists, nothing to release"
            exit 0
          fi

          # pull this release's notes back out of the cumulative changelog
          notes=$(awk -v hdr="### Version $version" '
            index($0, hdr) == 1 { flag = 1; next }
            /^### Version / { flag = 0 }
            flag' HISTORY.md)

          gh release create "$version" \
            --target main \
            --title "modflowapi $version" \
            --notes "$notes" \
            --latest

  publish:
    name: Publish package
    # runs after the release is created, or after a draft release is published manually
    needs: release
    if: ${{ always() && github.repository_owner == 'MODFLOW-ORG' && ((github.event_name == 'push' && needs.release.result == 'success') || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mandatory for trusted publishing
    environment:  # requires a 'release' environment in repo settings
      name: release
      url: https://pypi.org/p/modflowapi
    defaults:
      run:
        shell: bash
    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check --strict dist/*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  reset:
    name: Reset develop
    # runs after the release is created, opens a PR merging main back into develop
    needs: release
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install
        run: uv sync --all-extras

      - name: Open reset pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.release.outputs.version }}"
          branch="post-release-$ver-reset"

          next=$(uv run scripts/update_version.py --get --next-dev)
          uv run scripts/update_version.py -v "$next"

          git config core.sharedRepository true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "ci(release): update version to $next"
          git push origin "$branch"

          body='
          # Reset `develop` after release '$ver'

          Merge (do not squash) this pull request to bring `main` back into `develop` and set the
          development version to `'$next'`.
          '
          gh pr create -B "develop" -H "$branch" --title "Reset develop after release $ver" --body "$body"
